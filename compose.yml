services:
  net-visualizer:
    build:
      context: .
    ports:
      # - '127.0.0.1:3000:3000'
      - '3000:3000'
    environment:
      # Explicitly set the networks you own or are authorized to monitor.
      PROBE_ALLOWED_CIDRS: ${PROBE_ALLOWED_CIDRS:-0.0.0.0/0}
      PROBE_WORKER_SOCKET: /run/probe/worker.sock
    depends_on:
      probe-worker:
        condition: service_healthy
    volumes:
      - probe-socket:/run/probe:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  probe-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      PROBE_ALLOWED_CIDRS: ${PROBE_ALLOWED_CIDRS:-0.0.0.0/0}
    volumes:
      - probe-socket:/run/probe
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ping_group_range: '1000 1000'
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.mjs']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  probe-socket:
